<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>3091</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }


        body {

            min-height: 100vh;
            height: 100vh;

            font-family:
                Arial,
                "Noto Sans Arabic",
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 8px;

            overflow: hidden;

            position: relative;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(255, 210, 225, 0.65),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 85% 20%,
                    rgba(255, 235, 195, 0.65),
                    transparent 25%
                ),

                linear-gradient(
                    135deg,
                    #fffafd,
                    #fff7f9,
                    #fffdf8
                );

            transition:
                background 1s ease;
        }


        /* =========================
           HAPPY BACKGROUND
        ========================= */

        .flower {

            position: fixed;

            pointer-events: none;

            user-select: none;

            z-index: 0;

            animation:
                floating 5s ease-in-out infinite;

            transition:
                opacity 0.7s ease;
        }


        .flower1 {
            top: 4%;
            left: 5%;
            font-size: 34px;
        }


        .flower2 {
            top: 12%;
            right: 5%;
            font-size: 30px;
            animation-delay: 1s;
        }


        .flower3 {
            bottom: 8%;
            left: 6%;
            font-size: 38px;
            animation-delay: 2s;
        }


        .flower4 {
            bottom: 10%;
            right: 5%;
            font-size: 32px;
            animation-delay: 1.5s;
        }


        .flower5 {
            top: 45%;
            left: 2%;
            font-size: 25px;
            animation-delay: 2.5s;
        }


        .flower6 {
            top: 55%;
            right: 2%;
            font-size: 27px;
            animation-delay: 3s;
        }


        /* =========================
           LILY
        ========================= */

        .lily {

            position: fixed;

            pointer-events: none;

            user-select: none;

            z-index: 0;

            opacity: 0.75;

            filter:
                drop-shadow(
                    0 4px 8px
                    rgba(170, 100, 130, 0.18)
                );

            animation:
                lilyFloat 6s ease-in-out infinite;

            transition:
                opacity 0.7s ease;
        }


        .lily1 {
            top: 3%;
            right: 20%;
            font-size: 34px;
        }


        .lily2 {
            bottom: 4%;
            left: 20%;
            font-size: 32px;
            animation-delay: 2s;
        }


        .lily3 {
            top: 62%;
            right: 15%;
            font-size: 28px;
            animation-delay: 1s;
        }


        /* =========================
           SPARKLES
        ========================= */

        .sparkle {

            position: fixed;

            pointer-events: none;

            z-index: 0;

            color: #d9b58b;

            font-size: 18px;

            animation:
                sparkleMove 3s ease-in-out infinite;

            transition:
                opacity 0.7s ease;
        }


        .s1 {
            top: 15%;
            left: 35%;
        }


        .s2 {
            top: 35%;
            right: 22%;
            animation-delay: 1s;
        }


        .s3 {
            bottom: 18%;
            right: 30%;
            animation-delay: 1.7s;
        }


        .s4 {
            bottom: 35%;
            left: 20%;
            animation-delay: 0.5s;
        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes floating {

            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(0deg);
            }

            50% {
                transform:
                    translateY(-12px)
                    rotate(7deg);
            }
        }


        @keyframes lilyFloat {

            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(-3deg);
            }

            50% {
                transform:
                    translateY(-10px)
                    rotate(5deg);
            }
        }


        @keyframes sparkleMove {

            0%,
            100% {
                opacity: 0.25;
                transform: scale(0.7);
            }

            50% {
                opacity: 1;
                transform: scale(1.25);
            }
        }


        /* =========================
           SAD BACKGROUND
        ========================= */

        body.sad {

            background:

                radial-gradient(
                    circle at 50% 20%,
                    rgba(100, 110, 130, 0.35),
                    transparent 35%
                ),

                linear-gradient(
                    160deg,
                    #252936,
                    #171a23,
                    #0d0f15
                );
        }


        body.sad .flower,
        body.sad .lily,
        body.sad .sparkle {

            opacity: 0;
        }


        /* Rain */

        body.sad::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: 1;

            opacity: 0.35;

            background-image:
                repeating-linear-gradient(
                    105deg,
                    transparent 0px,
                    transparent 18px,
                    rgba(180, 200, 220, 0.25) 19px,
                    transparent 20px
                );

            background-size:
                30px 30px;

            animation:
                rain 0.7s linear infinite;
        }


        @keyframes rain {

            from {
                background-position:
                    0 0;
            }

            to {
                background-position:
                    -30px 60px;
            }
        }



        /* =========================
           STORY
        ========================= */

        .story {

            width: 100%;

            max-width: 420px;

            height: 100vh;

            max-height: 100vh;

            text-align: center;

            position: relative;

            z-index: 2;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            overflow: visible;
        }



        /* =========================
           IMAGE
        ========================= */

        .character {

            width: 100%;

            max-width: 310px;

            max-height: 43vh;

            height: auto;

            object-fit: contain;

            display: block;

            margin:
                0 auto 10px auto;

            user-select: none;

            -webkit-user-drag: none;

            filter:
                drop-shadow(
                    0 8px 18px
                    rgba(0, 0, 0, 0.13)
                );

            animation:
                imageShow 0.8s ease;
        }


        @keyframes imageShow {

            from {
                opacity: 0;
                transform: scale(0.94);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }



        /* =========================
           TEXT
        ========================= */

        .story-text {

            color: #3b3032;

            font-size: 19px;

            line-height: 1.65;

            min-height: 65px;

            width: 100%;

            max-width: 390px;

            padding:
                0 8px;

            margin:
                0 auto 8px auto;

            font-weight: 500;

            transition:
                color 0.8s ease;
        }


        body.sad .story-text {

            color: #eeeeee;
        }



        /* =========================
           BUTTON AREA
        ========================= */

        .buttons {

            position: relative;

            width: 100%;

            height: 125px;

            overflow: visible;
        }



        /* =========================
           BUTTONS
        ========================= */

        button {

            width: 82%;

            max-width: 300px;

            padding:
                10px 15px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.96
                );

            color: #3b3032;

            border:
                1px solid #eadde1;

            border-radius: 13px;

            font-size: 16px;

            font-family: inherit;

            cursor: pointer;

            box-shadow:
                0 4px 15px
                rgba(
                    120,
                    80,
                    90,
                    0.12
                );

            transition:
                left 0.07s linear,
                top 0.07s linear,
                transform 0.07s linear;
        }



        /* =========================
           BUTTON 1 - FIRST SCENE
        ========================= */

        #helloButton {

            position: absolute;

            top: 0;

            left: 50%;

            transform:
                translateX(-50%);
        }


        #helloButton::before {

            content: "🤎";

            margin-left: 8px;

            font-size: 20px;
        }


        #helloButton::after {

            content: "🌷";

            margin-right: 8px;

            font-size: 20px;
        }



        /* =========================
           BUTTON 2 - FIRST SCENE
        ========================= */

        #sadButton {

            position: absolute;

            top: 55px;

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 20;

            white-space: nowrap;
        }



        /* =========================
           SECOND SCENE
        ========================= */

        body.sad #helloButton {

            position: absolute;

            top: 0;

            left: 50%;

            transform:
                translateX(-50%);
        }


        body.sad #helloButton::before {

            content: "";
        }


        body.sad #helloButton::after {

            content: "";
        }


        body.sad #sadButton {

            position: absolute;

            top: 55px;

            left: 50%;

            transform:
                translateX(-50%);
        }



        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-height: 700px) {

            .character {

                max-width: 260px;

                max-height: 36vh;

                margin-bottom: 5px;
            }


            .story-text {

                font-size: 17px;

                line-height: 1.5;

                min-height: 55px;

                margin-bottom: 5px;
            }


            .buttons {

                height: 115px;
            }


            button {

                padding:
                    8px 12px;

                font-size: 15px;
            }


            #sadButton {

                top: 50px;
            }
        }



        /* =========================
           VERY SMALL SCREEN
        ========================= */

        @media (max-height: 600px) {

            .character {

                max-width: 220px;

                max-height: 31vh;
            }


            .story-text {

                font-size: 15px;

                min-height: 45px;
            }


            .buttons {

                height: 100px;
            }


            button {

                padding:
                    7px 10px;

                font-size: 14px;
            }


            #sadButton {

                top: 43px;
            }
        }



        /* =========================
           WIDE PHONES
        ========================= */

        @media (min-width: 501px) {

            .character {

                max-width: 320px;
            }


            .story-text {

                font-size: 20px;
            }
        }

    </style>

</head>



<body>


    <!-- =========================
         FLOWERS
    ========================= -->

    <div class="flower flower1">🌸</div>

    <div class="flower flower2">🌷</div>

    <div class="flower flower3">🌺</div>

    <div class="flower flower4">🌸</div>

    <div class="flower flower5">🌷</div>

    <div class="flower flower6">🌺</div>



    <!-- LILY -->

    <div class="lily lily1">🌷</div>

    <div class="lily lily2">🌷</div>

    <div class="lily lily3">🌷</div>



    <!-- SPARKLES -->

    <div class="sparkle s1">✦</div>

    <div class="sparkle s2">✧</div>

    <div class="sparkle s3">✦</div>

    <div class="sparkle s4">✧</div>



    <!-- =========================
         STORY
    ========================= -->

    <div class="story">


        <!-- IMAGE -->

        <img
            id="characterImage"
            src="bc2f39106e1a0c2f00d3cc1204eaec7a.jpg"
            alt="کاوی"
            class="character"
        >



        <!-- TEXT -->

        <div
            class="story-text"
            id="storyText">
        </div>



        <!-- BUTTONS -->

        <div
            class="buttons"
            id="buttonArea">


            <!-- FIRST BUTTON -->

            <button
                id="helloButton">

                سڵاو گیان

            </button>



            <!-- SECOND BUTTON -->

            <button
                id="sadButton">

                خۆش حاڵ نەبووم

            </button>


        </div>


    </div>



    <script>


        /* =========================
           ELEMENTS
        ========================= */

        const body =
            document.body;


        const image =
            document.getElementById(
                "characterImage"
            );


        const text =
            document.getElementById(
                "storyText"
            );


        const helloButton =
            document.getElementById(
                "helloButton"
            );


        const sadButton =
            document.getElementById(
                "sadButton"
            );


        const buttonArea =
            document.getElementById(
                "buttonArea"
            );



        /* =========================
           FIRST TEXT
        ========================= */

        const firstMessage =
            "سڵاو من کاوی، زۆرم خۆشەوێی بەساقەو بم نونی گیان";


        /* =========================
           SECOND TEXT
        ========================= */

        const secondMessage =
            "زۆر بێتاقەتم";



        /* =========================
           TYPE TEXT FUNCTION
        ========================= */

        let typingTimer = null;


        function typeText(message) {


            if (typingTimer) {

                clearTimeout(
                    typingTimer
                );
            }


            text.textContent = "";


            let i = 0;


            function writeLetter() {


                if (
                    i <
                    message.length
                ) {


                    text.textContent +=
                        message.charAt(i);


                    i++;


                    typingTimer =
                        setTimeout(
                            writeLetter,
                            75
                        );
                }

            }


            writeLetter();
        }



        /* Start */

        typeText(
            firstMessage
        );



        /* =========================
           MOVING BUTTON
        ========================= */

        function moveSadButton() {


            const buttonWidth =
                sadButton.offsetWidth;


            const buttonHeight =
                sadButton.offsetHeight;


            const screenWidth =
                window.innerWidth;


            const screenHeight =
                window.innerHeight;


            const maxX =
                Math.max(
                    5,
                    screenWidth -
                    buttonWidth -
                    5
                );


            const maxY =
                Math.max(
                    5,
                    screenHeight -
                    buttonHeight -
                    5
                );


            const randomX =
                Math.floor(
                    Math.random() *
                    maxX
                );


            const randomY =
                Math.floor(
                    Math.random() *
                    maxY
                );


            sadButton.style.position =
                "fixed";


            sadButton.style.left =
                randomX + "px";


            sadButton.style.top =
                randomY + "px";


            sadButton.style.transform =
                "none";
        }



        /* =========================
           FIRST BUTTON
           GO TO SECOND SCENE
        ========================= */

        helloButton.addEventListener(
            "click",
            function () {


                /* Change image */

                image.style.opacity = "0";


                setTimeout(
                    function () {


                        image.src =
                            "7b4e45edfbedd4efbcc4bab78fbefaec.jpg";


                        image.style.opacity =
                            "1";


                    },
                    350
                );



                /* Change background */

                body.classList.add(
                    "sad"
                );



                /* Change text */

                typeText(
                    secondMessage
                );



                /* Change first button */

                helloButton.textContent =
                    "بێتاقەت مەبە 🤗";



                /* Change second button */

                sadButton.textContent =
                    "بۆ بێتاقەتی 🤔";



                /*
                 * گرنگ:
                 * لە قۆناغی دووەمدا
                 * دوگمەکان جێگیر دەبن.
                 */

                sadButton.style.position =
                    "absolute";


                sadButton.style.left =
                    "50%";


                sadButton.style.top =
                    "55px";


                sadButton.style.transform =
                    "translateX(-50%)";


                helloButton.style.position =
                    "absolute";


                helloButton.style.left =
                    "50%";


                helloButton.style.top =
                    "0";


                helloButton.style.transform =
                    "translateX(-50%)";


                /*
                 * لە قۆناغی دووەمدا
                 * ئەم دوگمەیەش ناچالاک دەکەین
                 * بۆ ئەوەی تەنیا وەک دوگمەی
                 * جێگیر بمێنێتەوە.
                 */

                helloButton.disabled =
                    true;


                sadButton.disabled =
                    true;

            }
        );



        /* =========================
           MOVING BUTTON - TOUCH
           ONLY FIRST SCENE
        ========================= */

        sadButton.addEventListener(
            "touchstart",
            function (event) {


                /*
                 * ئەگەر قۆناغی دووەمە،
                 * هیچ مەجوڵێنین.
                 */

                if (
                    body.classList.contains(
                        "sad"
                    )
                ) {

                    return;
                }


                event.preventDefault();


                moveSadButton();

            },
            {
                passive: false
            }
        );



        /* =========================
           MOVING BUTTON - MOUSE
           ONLY FIRST SCENE
        ========================= */

        sadButton.addEventListener(
            "pointerenter",
            function () {


                if (
                    body.classList.contains(
                        "sad"
                    )
                ) {

                    return;
                }


                moveSadButton();

            }
        );



        /* =========================
           MOVING BUTTON - POINTER
           ONLY FIRST SCENE
        ========================= */

        sadButton.addEventListener(
            "pointerdown",
            function (event) {


                if (
                    body.classList.contains(
                        "sad"
                    )
                ) {

                    return;
                }


                event.preventDefault();


                moveSadButton();

            }
        );



        /* =========================
           CLICK
           ONLY FIRST SCENE
        ========================= */

        sadButton.addEventListener(
            "click",
            function (event) {


                if (
                    body.classList.contains(
                        "sad"
                    )
                ) {

                    return;
                }


                event.preventDefault();


                moveSadButton();

            }
        );


    </script>


</body>

</html>
