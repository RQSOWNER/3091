<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>3091</title>


    <style>

        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =========================
           PAGE
        ========================= */

        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;
        }


        body {

            background:

                radial-gradient(
                    circle at 15% 15%,
                    rgba(255, 210, 225, 0.65),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 85% 20%,
                    rgba(255, 235, 195, 0.65),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 20% 85%,
                    rgba(240, 215, 255, 0.45),
                    transparent 25%
                ),

                linear-gradient(
                    135deg,
                    #fffafd,
                    #fff7f9,
                    #fffdf8
                );


            min-height: 100vh;
            height: 100vh;

            font-family:
                Arial,
                "Noto Sans Arabic",
                sans-serif;


            display: flex;

            justify-content: center;

            align-items: center;


            padding: 8px;


            overflow: hidden;

            position: relative;
        }



        /* =========================
           BACKGROUND FLOWERS
        ========================= */

        .flower {

            position: fixed;

            pointer-events: none;

            user-select: none;

            z-index: 0;

            animation:
                floating 5s ease-in-out infinite;
        }


        .flower1 {

            top: 4%;

            left: 5%;

            font-size: 34px;
        }


        .flower2 {

            top: 12%;

            right: 5%;

            font-size: 30px;

            animation-delay: 1s;
        }


        .flower3 {

            bottom: 8%;

            left: 6%;

            font-size: 38px;

            animation-delay: 2s;
        }


        .flower4 {

            bottom: 10%;

            right: 5%;

            font-size: 32px;

            animation-delay: 1.5s;
        }


        .flower5 {

            top: 45%;

            left: 2%;

            font-size: 25px;

            animation-delay: 2.5s;
        }


        .flower6 {

            top: 55%;

            right: 2%;

            font-size: 27px;

            animation-delay: 3s;
        }



        /* =========================
           LILY FLOWERS
        ========================= */

        .lily {

            position: fixed;

            pointer-events: none;

            user-select: none;

            z-index: 0;

            opacity: 0.75;

            filter:
                drop-shadow(
                    0 4px 8px
                    rgba(170, 100, 130, 0.18)
                );

            animation:
                lilyFloat 6s ease-in-out infinite;
        }


        .lily1 {

            top: 3%;

            right: 20%;

            font-size: 34px;
        }


        .lily2 {

            bottom: 4%;

            left: 20%;

            font-size: 32px;

            animation-delay: 2s;
        }


        .lily3 {

            top: 62%;

            right: 15%;

            font-size: 28px;

            animation-delay: 1s;
        }



        /* =========================
           SPARKLES
        ========================= */

        .sparkle {

            position: fixed;

            pointer-events: none;

            z-index: 0;

            color: #d9b58b;

            font-size: 18px;

            animation:
                sparkleMove 3s ease-in-out infinite;
        }


        .s1 {

            top: 15%;

            left: 35%;
        }


        .s2 {

            top: 35%;

            right: 22%;

            animation-delay: 1s;
        }


        .s3 {

            bottom: 18%;

            right: 30%;

            animation-delay: 1.7s;
        }


        .s4 {

            bottom: 35%;

            left: 20%;

            animation-delay: 0.5s;
        }



        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes floating {

            0%,
            100% {

                transform:
                    translateY(0)
                    rotate(0deg);
            }

            50% {

                transform:
                    translateY(-12px)
                    rotate(7deg);
            }
        }


        @keyframes lilyFloat {

            0%,
            100% {

                transform:
                    translateY(0)
                    rotate(-3deg);
            }

            50% {

                transform:
                    translateY(-10px)
                    rotate(5deg);
            }
        }


        @keyframes sparkleMove {

            0%,
            100% {

                opacity: 0.25;

                transform:
                    scale(0.7);
            }

            50% {

                opacity: 1;

                transform:
                    scale(1.25);
            }
        }



        /* =========================
           MAIN STORY
        ========================= */

        .story {

            width: 100%;

            max-width: 420px;

            height: 100vh;

            max-height: 100vh;

            text-align: center;

            position: relative;

            z-index: 2;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            overflow: visible;
        }



        /* =========================
           CHARACTER IMAGE
        ========================= */

        .character {

            width: 100%;

            max-width: 310px;

            max-height: 43vh;

            height: auto;

            object-fit: contain;

            display: block;

            margin: 0 auto 10px auto;

            user-select: none;

            -webkit-user-drag: none;

            filter:
                drop-shadow(
                    0 8px 18px
                    rgba(0, 0, 0, 0.13)
                );

            animation:
                imageShow 0.8s ease;
        }



        /* =========================
           STORY TEXT
        ========================= */

        .story-text {

            color: #3b3032;

            font-size: 19px;

            line-height: 1.65;

            min-height: 65px;

            width: 100%;

            max-width: 390px;

            padding: 0 8px;

            margin: 0 auto 8px auto;

            font-weight: 500;
        }



        /* =========================
           BUTTON AREA
        ========================= */

        .buttons {

            position: relative;

            width: 100%;

            height: 125px;

            overflow: visible;
        }



        /* =========================
           ALL BUTTONS
        ========================= */

        button {

            width: 82%;

            max-width: 300px;

            padding: 10px 15px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.96
                );

            color: #3b3032;

            border:
                1px solid #eadde1;

            border-radius: 13px;

            font-size: 16px;

            font-family: inherit;

            cursor: pointer;

            box-shadow:
                0 4px 15px
                rgba(
                    120,
                    80,
                    90,
                    0.12
                );

            transition:

                left 0.07s linear,

                top 0.07s linear,

                transform 0.07s linear;

            backdrop-filter:
                blur(5px);
        }



        /* =========================
           FIRST BUTTON
        ========================= */

        #helloButton {

            position: absolute;

            top: 0;

            left: 50%;

            transform:
                translateX(-50%);
        }


        /*
         * 🤎 لە سەرەتای دوگمە
         */

        #helloButton::before {

            content: "🤎";

            margin-left: 8px;

            font-size: 20px;
        }


        /*
         * 🌷 لە لای چەپ
         */

        #helloButton::after {

            content: "🌷";

            margin-right: 8px;

            font-size: 20px;
        }



        /* =========================
           SECOND BUTTON
        ========================= */

        #sadButton {

            position: absolute;

            top: 55px;

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 20;

            white-space: nowrap;
        }



        /* =========================
           IMAGE ANIMATION
        ========================= */

        @keyframes imageShow {

            from {

                opacity: 0;

                transform:
                    scale(0.94);
            }

            to {

                opacity: 1;

                transform:
                    scale(1);
            }
        }



        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-height: 700px) {

            .character {

                max-width: 260px;

                max-height: 36vh;

                margin-bottom: 5px;
            }


            .story-text {

                font-size: 17px;

                line-height: 1.5;

                min-height: 55px;

                margin-bottom: 5px;
            }


            .buttons {

                height: 115px;
            }


            button {

                padding: 8px 12px;

                font-size: 15px;
            }


            #sadButton {

                top: 50px;
            }
        }



        /* =========================
           VERY SMALL SCREENS
        ========================= */

        @media (max-height: 600px) {

            .character {

                max-width: 220px;

                max-height: 31vh;
            }


            .story-text {

                font-size: 15px;

                min-height: 45px;
            }


            .buttons {

                height: 100px;
            }


            button {

                padding: 7px 10px;

                font-size: 14px;
            }


            #sadButton {

                top: 43px;
            }
        }



        /* =========================
           WIDE PHONES
        ========================= */

        @media (min-width: 501px) {

            .character {

                max-width: 320px;
            }


            .story-text {

                font-size: 20px;
            }
        }

    </style>

</head>



<body>


    <!-- =========================
         BACKGROUND FLOWERS
    ========================= -->


    <div class="flower flower1">
        🌸
    </div>


    <div class="flower flower2">
        🌷
    </div>


    <div class="flower flower3">
        🌺
    </div>


    <div class="flower flower4">
        🌸
    </div>


    <div class="flower flower5">
        🌷
    </div>


    <div class="flower flower6">
        🌺
    </div>



    <!-- LILY -->


    <div class="lily lily1">
        🌷
    </div>


    <div class="lily lily2">
        🌷
    </div>


    <div class="lily lily3">
        🌷
    </div>



    <!-- SPARKLES -->


    <div class="sparkle s1">
        ✦
    </div>


    <div class="sparkle s2">
        ✧
    </div>


    <div class="sparkle s3">
        ✦
    </div>


    <div class="sparkle s4">
        ✧
    </div>



    <!-- =========================
         MAIN STORY
    ========================= -->


    <div class="story">


        <!-- IMAGE -->


        <img
            src="bc2f39106e1a0c2f00d3cc1204eaec7a.jpg"
            alt="کاوی"
            class="character"
        >



        <!-- TEXT -->


        <div
            class="story-text"
            id="storyText">
        </div>



        <!-- BUTTONS -->


        <div
            class="buttons"
            id="buttonArea">


            <!-- BUTTON 1 -->


            <button
                id="helloButton">

                سڵاو گیان

            </button>



            <!-- BUTTON 2 -->


            <button
                id="sadButton">

                خۆش حاڵ نەبووم

            </button>


        </div>


    </div>



    <script>


        /* =========================
           TYPING EFFECT
        ========================= */


        const message =
            "سڵاو من کاوی، زۆرم خۆشەوێی بەساقەو بم نونی گیان";


        const textElement =
            document.getElementById(
                "storyText"
            );


        let currentLetter = 0;


        function typeText() {


            if (
                currentLetter <
                message.length
            ) {


                textElement.textContent +=
                    message.charAt(
                        currentLetter
                    );


                currentLetter++;


                setTimeout(
                    typeText,
                    70
                );
            }

        }


        typeText();



        /* =========================
           HELLO BUTTON
        ========================= */


        const helloButton =
            document.getElementById(
                "helloButton"
            );


        helloButton.addEventListener(
            "click",
            function () {

                alert(
                    "سڵاو گیان ❤️"
                );

            }
        );



        /* =========================
           MOVING BUTTON
        ========================= */


        const sadButton =
            document.getElementById(
                "sadButton"
            );



        /*
         * شوێنی نوێی زۆر دوور
         */

        function moveSadButton() {


            const buttonWidth =
                sadButton.offsetWidth;


            const buttonHeight =
                sadButton.offsetHeight;



            const screenWidth =
                window.innerWidth;


            const screenHeight =
                window.innerHeight;



            /*
             * هەموو شاشەکە بەکاردێنین
             */

            const maxX =
                Math.max(
                    5,
                    screenWidth -
                    buttonWidth -
                    5
                );


            const maxY =
                Math.max(
                    5,
                    screenHeight -
                    buttonHeight -
                    5
                );



            /*
             * شوێنی هەڕەمەکی
             */

            const randomX =
                Math.floor(
                    Math.random() *
                    maxX
                );


            const randomY =
                Math.floor(
                    Math.random() *
                    maxY
                );



            /*
             * لە هەموو شاشەکەدا دەجوڵێت
             */

            sadButton.style.position =
                "fixed";


            sadButton.style.left =
                randomX + "px";


            sadButton.style.top =
                randomY + "px";


            sadButton.style.transform =
                "none";
        }



        /* =========================
           TOUCH
        ========================= */


        sadButton.addEventListener(
            "touchstart",
            function (event) {

                event.preventDefault();

                moveSadButton();

            },
            {
                passive: false
            }
        );



        /* =========================
           MOUSE
        ========================= */


        sadButton.addEventListener(
            "pointerenter",
            function () {

                moveSadButton();

            }
        );



        /* =========================
           POINTER DOWN
        ========================= */


        sadButton.addEventListener(
            "pointerdown",
            function (event) {

                event.preventDefault();

                moveSadButton();

            }
        );



        /* =========================
           CLICK
        ========================= */


        sadButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                moveSadButton();

            }
        );


    </script>


</body>

</html>
