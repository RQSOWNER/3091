<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>3091</title>


<style>

/* =================================
   BASIC
================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
}

body{

  font-family:Arial,sans-serif;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;

  background:
    radial-gradient(
      circle at 15% 20%,
      rgba(255,255,255,.95),
      transparent 22%
    ),
    radial-gradient(
      circle at 85% 15%,
      rgba(255,220,230,.85),
      transparent 25%
    ),
    linear-gradient(
      135deg,
      #fff8fa,
      #ffe1ea,
      #fff
    );

  transition:
    background .6s ease;
}


/* =================================
   STORY
================================= */

.story{

  position:relative;

  z-index:10;

  width:min(92vw,420px);

  text-align:center;
}


#characterImage{

  width:min(75vw,280px);

  max-height:45vh;

  object-fit:cover;

  border-radius:24px;

  box-shadow:
    0 15px 40px
    rgba(120,30,60,.20);
}


.story-text{

  min-height:58px;

  margin:20px 0;

  font-size:20px;

  font-weight:700;

  color:#6b2039;

  text-shadow:
    0 2px 8px
    rgba(255,255,255,.8);
}


.buttons{

  position:relative;

  min-height:130px;
}


/* =================================
   BUTTONS
================================= */

button{

  border:0;

  border-radius:999px;

  padding:14px 24px;

  margin:7px;

  font-size:16px;

  font-weight:700;

  cursor:pointer;

  box-shadow:
    0 8px 22px
    rgba(90,20,50,.18);

  position:relative;

  z-index:30;

  user-select:none;

  touch-action:none;
}


/* Hello */

#helloButton{

  background:
    linear-gradient(
      135deg,
      #f7cbd8,
      #fff0f5
    );

  color:#721d3d;
}


/* Run away button */

#sadButton{

  background:#f5eef1;

  color:#555;

  transition:
    left .05s linear,
    top .05s linear;
}


/* Scene 3 */

#confusedButton{

  display:none;

  background:#ffd166;

  color:#432;
}


/* Skip */

#skipButton{

  display:none;

  position:fixed;

  font-size:12px;

  padding:6px 12px;

  min-width:90px;

  background:#fff;

  color:#444;
}


/* =================================
   ROMANTIC FLOWERS
   SCENE 1 ONLY
================================= */

.romantic-flower{

  position:absolute;

  z-index:1;

  pointer-events:none;

  user-select:none;

  filter:
    drop-shadow(
      0 5px 10px
      rgba(180,50,90,.15)
    );

  animation:
    flowerFloat 5s ease-in-out infinite;
}


.flower1{

  top:5%;
  left:5%;

  font-size:48px;
}


.flower2{

  top:10%;
  right:6%;

  font-size:42px;

  animation-delay:1s;
}


.flower3{

  bottom:8%;
  left:7%;

  font-size:45px;

  animation-delay:2s;
}


.flower4{

  bottom:12%;
  right:6%;

  font-size:50px;

  animation-delay:.7s;
}


.flower5{

  top:38%;
  left:3%;

  font-size:35px;

  animation-delay:1.5s;
}


.flower6{

  top:42%;
  right:4%;

  font-size:37px;

  animation-delay:2.5s;
}


.flower7{

  bottom:30%;
  left:20%;

  font-size:28px;

  animation-delay:1.8s;
}


.flower8{

  bottom:25%;
  right:20%;

  font-size:30px;

  animation-delay:.5s;
}


@keyframes flowerFloat{

  0%,100%{

    transform:
      translateY(0)
      rotate(-3deg);
  }

  50%{

    transform:
      translateY(-15px)
      rotate(5deg);
  }
}


/* Flowers disappear */

body.sad .romantic-flower,
body.confused .romantic-flower,
body.scene4 .romantic-flower{

  display:none;
}


/* =================================
   SCENE 2
================================= */

body.sad{

  background:
    linear-gradient(
      180deg,
      #172033,
      #26354d
    );
}


/* =================================
   SCENE 3
================================= */

body.confused{

  background:

    radial-gradient(
      circle at 20% 20%,
      #7b2cbf,
      transparent 35%
    ),

    radial-gradient(
      circle at 80% 30%,
      #ff006e,
      transparent 35%
    ),

    radial-gradient(
      circle at 50% 80%,
      #3a86ff,
      transparent 35%
    ),

    #18051f;

  animation:
    confusedBackground
    1.8s
    ease-in-out
    infinite;
}


body.confused .story-text{

  color:white;

  text-shadow:
    0 0 12px
    rgba(255,255,255,.5);
}


body.confused #confusedButton{

  display:block;
}


@keyframes confusedBackground{

  0%,100%{

    transform:
      translate(0,0)
      rotate(0deg);
  }

  25%{

    transform:
      translate(3px,-2px)
      rotate(.4deg);
  }

  50%{

    transform:
      translate(-3px,2px)
      rotate(-.4deg);
  }

  75%{

    transform:
      translate(2px,1px)
      rotate(.3deg);
  }
}


/* =================================
   SCENE 4
================================= */

body.scene4{

  background:

    radial-gradient(
      circle at 20% 20%,
      #fff,
      transparent 30%
    ),

    linear-gradient(
      135deg,
      #fff5f8,
      #ffdce7,
      #fff
    );
}


/* =================================
   MOBILE
================================= */

@media(max-width:600px){

  .flower1{
    font-size:40px;
  }

  .flower2{
    font-size:36px;
  }

  .flower3{
    font-size:38px;
  }

  .flower4{
    font-size:42px;
  }

  .flower5,
  .flower6{
    font-size:30px;
  }

  .flower7,
  .flower8{
    font-size:24px;
  }

  .story-text{
    font-size:18px;
  }

}

</style>

</head>


<body>


<!-- =================================
     ROMANTIC FLOWERS
================================= -->

<div class="romantic-flower flower1">
  🌹
</div>

<div class="romantic-flower flower2">
  🌷
</div>

<div class="romantic-flower flower3">
  🌸
</div>

<div class="romantic-flower flower4">
  🌹
</div>

<div class="romantic-flower flower5">
  🌷
</div>

<div class="romantic-flower flower6">
  🌸
</div>

<div class="romantic-flower flower7">
  🌺
</div>

<div class="romantic-flower flower8">
  🌷
</div>


<!-- =================================
     STORY
================================= -->

<div class="story">


  <img
    id="characterImage"
    src="bc2f39106e1a0c2f00d3cc1204eaec7a.jpg"
    alt="story image"
  >


  <div
    id="storyText"
    class="story-text">
  </div>


  <div class="buttons">


    <button id="helloButton">
      سڵاو گیان
    </button>


    <button id="sadButton">
      خۆش حاڵ نەبووم
    </button>


    <button id="confusedButton">
      قەلەقی چیت
    </button>


    <button id="skipButton">
      skip naz
    </button>


  </div>

</div>


<script>


/* =================================
   ELEMENTS
================================= */

const body =
document.body;


const image =
document.getElementById(
  "characterImage"
);


const text =
document.getElementById(
  "storyText"
);


const helloButton =
document.getElementById(
  "helloButton"
);


const sadButton =
document.getElementById(
  "sadButton"
);


const confusedButton =
document.getElementById(
  "confusedButton"
);


const skipButton =
document.getElementById(
  "skipButton"
);


/* =================================
   TEXTS
================================= */

const firstMessage =
"سڵاو من کاوی، زۆرم خۆشەوێی بەساقەو بم نونی گیان";


const secondMessage =
"زۆر بێتاقەتم";


const thirdMessage =
"بەخوا زۆر قەلەقم 💔";


let typingTimer = null;


let confusedStep = 0;


/* =================================
   TYPE TEXT
================================= */

function typeText(message){

  clearInterval(
    typingTimer
  );


  text.textContent = "";


  let i = 0;


  typingTimer =
  setInterval(function(){

    if(i < message.length){

      text.textContent +=
        message[i];

      i++;

    }

    else{

      clearInterval(
        typingTimer
      );

    }

  },75);
}


/* =================================
   RANDOM FAR POSITION
================================= */

function moveButtonFar(button){

  const margin = 5;


  const maxX =
    window.innerWidth -
    button.offsetWidth -
    margin;


  const maxY =
    window.innerHeight -
    button.offsetHeight -
    margin;


  const x =
    margin +
    Math.random() *
    Math.max(
      1,
      maxX - margin
    );


  const y =
    margin +
    Math.random() *
    Math.max(
      1,
      maxY - margin
    );


  button.style.position =
    "fixed";


  button.style.left =
    x + "px";


  button.style.top =
    y + "px";
}


/* =================================
   SCENE 1
   HELLO → SCENE 2
================================= */

/*
   تەنیا ئەم دوگمەیە
   دەچێتە وێنەی ٢
*/

helloButton.addEventListener(
  "pointerdown",
  function(event){

    if(

      !body.classList.contains(
        "sad"
      )

      &&

      !body.classList.contains(
        "confused"
      )

      &&

      !body.classList.contains(
        "scene4"
      )

    ){

      event.preventDefault();

      event.stopPropagation();

      goToScene2();

    }

  }
);


/* =================================
   SCENE 1
   SAD BUTTON
================================= */

/*
   خۆش حاڵ نەبووم:

   ❌ وێنە ناگۆڕێت
   ❌ Scene 2 ناکات
   ❌ کلیک ناکرێت

   ✅ هەر پەنجەی لێ بدرێت
      بە خێرایی زۆر ڕادەکات

   ✅ مەودای دوور
*/

sadButton.addEventListener(
  "pointerdown",
  function(event){

    if(
      !body.classList.contains(
        "sad"
      )
    ){

      event.preventDefault();

      event.stopPropagation();

      moveButtonFar(
        sadButton
      );

    }

  }
);


/*
   ئەگەر پەنجە/ماوس
   نزیکیش ببێتەوە
*/

sadButton.addEventListener(
  "pointerenter",
  function(){

    if(
      !body.classList.contains(
        "sad"
      )
    ){

      moveButtonFar(
        sadButton
      );

    }

  }
);


/*
   کلیکی تەواو لە Scene 1
   هیچ کاری ناکات.
*/

sadButton.addEventListener(
  "click",
  function(event){

    if(
      !body.classList.contains(
        "sad"
      )
    ){

      event.preventDefault();

      event.stopPropagation();

      moveButtonFar(
        sadButton
      );

    }

  }
);


/* =================================
   SCENE 1 → SCENE 2
================================= */

function goToScene2(){

  body.classList.remove(
    "confused"
  );

  body.classList.remove(
    "scene4"
  );

  body.classList.add(
    "sad"
  );


  image.src =
    "7b4e45edfbedd4efbcc4bab78fbefaec.jpg";


  typeText(
    secondMessage
  );


  helloButton.textContent =
    "بێتاقەت مەبە 🤗";


  sadButton.textContent =
    "بۆ بێتاقەتی 🤔";


  /* Reset positions */

  helloButton.style.position =
    "relative";

  helloButton.style.left = "";

  helloButton.style.top = "";


  sadButton.style.position =
    "relative";

  sadButton.style.left = "";

  sadButton.style.top = "";


  confusedButton.style.display =
    "none";


  skipButton.style.display =
    "none";
}


/* =================================
   SCENE 2
   BUTTON 1 MOVES
================================= */

helloButton.addEventListener(
  "pointerdown",
  function(event){

    if(
      body.classList.contains(
        "sad"
      )
    ){

      event.preventDefault();

      event.stopPropagation();

      moveButtonFar(
        helloButton
      );

    }

  }
);


/* =================================
   SCENE 2
   BUTTON 2 → SCENE 3
================================= */

sadButton.addEventListener(
  "click",
  function(){

    if(
      body.classList.contains(
        "sad"
      )
    ){

      goToScene3();

    }

  }
);


/* =================================
   SCENE 2 → SCENE 3
================================= */

function goToScene3(){

  body.classList.remove(
    "sad"
  );

  body.classList.remove(
    "scene4"
  );

  body.classList.add(
    "confused"
  );


  image.src =
    "610ab076d09e74dd9d2b8bdd5fcaf35e.jpg";


  typeText(
    thirdMessage
  );


  helloButton.style.display =
    "none";


  sadButton.style.display =
    "none";


  confusedButton.style.display =
    "block";


  confusedButton.textContent =
    "قەلەقی چیت";


  confusedStep = 0;


  confusedButton.style.position =
    "relative";


  confusedButton.style.left = "";


  confusedButton.style.top = "";


  skipButton.style.display =
    "none";
}


/* =================================
   SCENE 3 BUTTON
================================= */

function moveConfusedButton(){

  confusedButton.style.position =
    "fixed";


  const rangeX = 120;

  const rangeY = 80;


  const centerX =
    window.innerWidth / 2;


  const centerY =
    window.innerHeight * .72;


  const x =
    centerX -
    rangeX / 2 +
    Math.random() *
    rangeX -
    confusedButton.offsetWidth / 2;


  const y =
    centerY -
    rangeY / 2 +
    Math.random() *
    rangeY -
    confusedButton.offsetHeight / 2;


  confusedButton.style.left =
    Math.max(
      10,
      x
    ) + "px";


  confusedButton.style.top =
    Math.max(
      10,
      y
    ) + "px";
}


function confusedButtonAction(){

  if(
    !body.classList.contains(
      "confused"
    )
  ){

    return;

  }


  confusedStep++;


  if(
    confusedStep === 1
  ){

    confusedButton.textContent =
      "نا نایڵێم ناز ئەکەم";


    moveConfusedButton();


    skipButton.style.display =
      "block";


    const rect =
      confusedButton
      .getBoundingClientRect();


    skipButton.style.position =
      "fixed";


    skipButton.style.left =
      (
        rect.left +
        rect.width / 2
      ) + "px";


    skipButton.style.top =
      (
        rect.bottom + 12
      ) + "px";


    skipButton.style.transform =
      "translateX(-50%)";

  }

  else{

    confusedButton.textContent =
      "دەی نازم زیاتر هەڵگرە 🤓";


    moveConfusedButton();

  }

}


/* =================================
   SCENE 3 BUTTON TOUCH
================================= */

confusedButton.addEventListener(
  "pointerdown",
  function(event){

    event.preventDefault();

    event.stopPropagation();

    confusedButtonAction();

  }
);


/* =================================
   SKIP NAZ → SCENE 4
================================= */

skipButton.addEventListener(
  "pointerdown",
  function(event){

    event.preventDefault();

    event.stopPropagation();

    goToScene4();

  }
);


/* =================================
   SCENE 4
================================= */

function goToScene4(){

  body.classList.remove(
    "sad"
  );

  body.classList.remove(
    "confused"
  );

  body.classList.add(
    "scene4"
  );


  image.src =
    "ece914e7ddcc0c54f9f9e56c7dccc1e2.jpg";


  text.textContent =
    "💖";


  helloButton.style.display =
    "none";


  sadButton.style.display =
    "none";


  confusedButton.style.display =
    "none";


  skipButton.style.display =
    "none";
}


/* =================================
   START
================================= */

typeText(
  firstMessage
);

</script>

</body>
</html>
