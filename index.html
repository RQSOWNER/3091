<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>3091</title>


<style>

/* =====================================================
   GENERAL
===================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}

body{

    font-family:Arial,sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(255,255,255,.95),
            transparent 22%
        ),
        radial-gradient(
            circle at 85% 15%,
            rgba(255,220,230,.85),
            transparent 25%
        ),
        linear-gradient(
            135deg,
            #fff8fa,
            #ffe1ea,
            #fff
        );

    transition:background .6s ease;
}


/* =====================================================
   STORY
===================================================== */

.story{

    position:relative;

    z-index:10;

    width:min(94vw,420px);

    text-align:center;
}


/* =====================================================
   IMAGE
===================================================== */

#characterImage{

    width:min(75vw,280px);

    max-height:45vh;

    object-fit:cover;

    border-radius:24px;

    box-shadow:
        0 15px 40px
        rgba(120,30,60,.20);
}


/* =====================================================
   TEXT
===================================================== */

.story-text{

    min-height:58px;

    margin:20px 0;

    font-size:20px;

    font-weight:700;

    color:#6b2039;

    line-height:1.8;

    text-shadow:
        0 2px 8px
        rgba(255,255,255,.8);
}


/* =====================================================
   BUTTON AREA
===================================================== */

.buttons{

    position:relative;

    min-height:170px;

}


/* =====================================================
   ALL BUTTONS
===================================================== */

button{

    border:0;

    border-radius:999px;

    padding:14px 24px;

    margin:7px;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 8px 22px
        rgba(90,20,50,.18);

    position:relative;

    z-index:30;

    user-select:none;

    touch-action:none;

}


/* =====================================================
   SCENE 1
===================================================== */

#helloButton{

    background:
        linear-gradient(
            135deg,
            #f7cbd8,
            #fff0f5
        );

    color:#721d3d;
}


#sadButton{

    background:#f5eef1;

    color:#555;

    transition:
        left .06s linear,
        top .06s linear;
}


/* =====================================================
   SCENE 2
===================================================== */

body.sad{

    background:
        linear-gradient(
            180deg,
            #172033,
            #26354d
        );
}


body.sad .story-text{

    color:white;

    text-shadow:
        0 2px 10px
        rgba(0,0,0,.35);
}


/*
   هەردوو دوگمە لە هەمان ڕیز
*/

body.sad .buttons{

    display:flex;

    flex-direction:row;

    flex-wrap:nowrap;

    align-items:center;

    justify-content:center;

    width:100%;

    gap:0;

    min-height:170px;
}


/*
   هەردووکیان سەرەتا لە تەنیشت یەکتر
*/

body.sad #helloButton,
body.sad #sadButton{

    display:inline-flex !important;

    align-items:center;

    justify-content:center;

    flex:0 0 auto;

    margin:2px;

    padding:12px 15px;

    white-space:nowrap;
}


/*
   بێتاقەت مەبە
   سەرەتا جێگیرە
*/

body.sad #helloButton{

    position:relative;

    left:auto;

    top:auto;

    right:auto;

    bottom:auto;

    transform:none;

    background:
        linear-gradient(
            135deg,
            #f7cbd8,
            #fff0f5
        );

    color:#721d3d;
}


/*
   بۆ بێتاقەتی
   هەمیشە جێگیرە
*/

body.sad #sadButton{

    position:relative !important;

    left:auto !important;

    top:auto !important;

    right:auto !important;

    bottom:auto !important;

    transform:none !important;

    background:
        linear-gradient(
            135deg,
            #d9e5f5,
            #fff
        );

    color:#26354d;
}


/* =====================================================
   SCENE 3
===================================================== */

#confusedButton{

    display:none;

    background:#ffd166;

    color:#432;

    transition:
        left .08s linear,
        top .08s linear;
}


body.confused{

    background:

        radial-gradient(
            circle at 20% 20%,
            #7b2cbf,
            transparent 35%
        ),

        radial-gradient(
            circle at 80% 30%,
            #ff006e,
            transparent 35%
        ),

        radial-gradient(
            circle at 50% 80%,
            #3a86ff,
            transparent 35%
        ),

        #18051f;

    animation:
        confusedBackground
        1.8s
        ease-in-out
        infinite;
}


body.confused .story-text{

    color:white;

    text-shadow:
        0 0 12px
        rgba(255,255,255,.5);
}


body.confused #confusedButton{

    display:block;
}


@keyframes confusedBackground{

    0%,100%{

        transform:
            translate(0,0)
            rotate(0deg);
    }

    25%{

        transform:
            translate(3px,-2px)
            rotate(.4deg);
    }

    50%{

        transform:
            translate(-3px,2px)
            rotate(-.4deg);
    }

    75%{

        transform:
            translate(2px,1px)
            rotate(.3deg);
    }
}


/* =====================================================
   SKIP NAZ
===================================================== */

#skipButton{

    display:none;

    position:fixed;

    font-size:12px;

    padding:6px 12px;

    min-width:90px;

    background:#fff;

    color:#444;
}


/* =====================================================
   SCENE 4
===================================================== */

.scene4-button{

    display:none;

    font-size:15px;

    background:
        linear-gradient(
            135deg,
            #f7d1dc,
            #fff
        );

    color:#6b2039;

    white-space:normal;

    max-width:90vw;
}


#notForgiveButton{

    transition:
        left .06s linear,
        top .06s linear;
}


#kissButton{

    background:
        linear-gradient(
            135deg,
            #ffd0df,
            #fff0f5
        );

    color:#721d3d;
}


body.scene4{

    background:

        radial-gradient(
            circle at 20% 20%,
            #fff,
            transparent 30%
        ),

        radial-gradient(
            circle at 80% 80%,
            #ffd0df,
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #fff5f8,
            #ffdce7,
            #fff
        );
}


body.scene4 .story-text{

    color:#6b2039;

    font-size:20px;

    margin-top:20px;

    margin-bottom:18px;
}


body.scene4 .scene4-button{

    display:inline-block;
}


/* =====================================================
   SCENE 5
===================================================== */

body.scene5{

    background:

        radial-gradient(
            circle at 20% 20%,
            #fff,
            transparent 30%
        ),

        radial-gradient(
            circle at 80% 80%,
            #ffd0df,
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #fff5f8,
            #ffdce7,
            #fff
        );
}


body.scene5 .story-text{

    color:#6b2039;

    font-size:20px;

    line-height:2;

    margin-bottom:5px;
}


/* =====================================================
   FINAL
===================================================== */

#finalEnd{

    display:none;

    margin-top:18px;

    color:#8b2348;

    animation:
        finalAppear
        .8s
        ease
        forwards;
}


.final-title{

    font-size:25px;

    font-weight:800;

    margin-bottom:8px;
}


.final-date{

    font-size:14px;

    font-weight:500;

    line-height:1.8;

    opacity:.85;
}


@keyframes finalAppear{

    from{

        opacity:0;

        transform:
            translateY(15px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }
}


/* =====================================================
   FLOWERS
===================================================== */

.romantic-flower{

    position:absolute;

    z-index:1;

    pointer-events:none;

    user-select:none;

    filter:
        drop-shadow(
            0 5px 10px
            rgba(180,50,90,.15)
        );

    animation:
        flowerFloat
        5s
        ease-in-out
        infinite;
}


.flower1{

    top:5%;
    left:5%;
    font-size:48px;
}


.flower2{

    top:10%;
    right:6%;
    font-size:42px;
    animation-delay:1s;
}


.flower3{

    bottom:8%;
    left:7%;
    font-size:45px;
    animation-delay:2s;
}


.flower4{

    bottom:12%;
    right:6%;
    font-size:50px;
    animation-delay:.7s;
}


.flower5{

    top:38%;
    left:3%;
    font-size:35px;
    animation-delay:1.5s;
}


.flower6{

    top:42%;
    right:4%;
    font-size:37px;
    animation-delay:2.5s;
}


.flower7{

    bottom:30%;
    left:20%;
    font-size:28px;
    animation-delay:1.8s;
}


.flower8{

    bottom:25%;
    right:20%;
    font-size:30px;
    animation-delay:.5s;
}


@keyframes flowerFloat{

    0%,100%{

        transform:
            translateY(0)
            rotate(-3deg);
    }

    50%{

        transform:
            translateY(-15px)
            rotate(5deg);
    }
}


/*
   گوڵەکان تەنیا لە Scene 1
*/

body.sad .romantic-flower,
body.confused .romantic-flower,
body.scene4 .romantic-flower,
body.scene5 .romantic-flower{

    display:none;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .story{

        width:94vw;
    }


    #characterImage{

        width:min(72vw,270px);
    }


    .story-text{

        font-size:18px;
    }


    /*
       Scene 2
       هەردوو دوگمە بە تەنیشت یەکتر
    */

    body.sad .buttons{

        display:flex;

        flex-direction:row;

        flex-wrap:nowrap;

        align-items:center;

        justify-content:center;

        gap:0;

        width:100%;
    }


    body.sad #helloButton,
    body.sad #sadButton{

        padding:11px 13px;

        font-size:14px;

        margin:2px;
    }


    body.scene5 .story-text{

        font-size:18px;
    }


    .final-title{

        font-size:23px;
    }


    .final-date{

        font-size:13px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     FLOWERS
===================================================== -->

<div class="romantic-flower flower1">🌹</div>
<div class="romantic-flower flower2">🌷</div>
<div class="romantic-flower flower3">🌸</div>
<div class="romantic-flower flower4">🌹</div>
<div class="romantic-flower flower5">🌷</div>
<div class="romantic-flower flower6">🌸</div>
<div class="romantic-flower flower7">🌺</div>
<div class="romantic-flower flower8">🌷</div>


<!-- =====================================================
     STORY
===================================================== -->

<div class="story">


    <img
        id="characterImage"
        src="bc2f39106e1a0c2f00d3cc1204eaec7a.jpg"
        alt="story image"
    >


    <div
        id="storyText"
        class="story-text">
    </div>


    <!-- =================================================
         FINAL
    ================================================== -->

    <div id="finalEnd">

        <div class="final-title">
            کۆتای
        </div>

        <div class="final-date">

            6/9/2026

            <br>

            6 ئێوارە

        </div>

    </div>


    <div class="buttons">


        <!-- =================================================
             SCENE 1 / SCENE 2
        ================================================== -->

        <button id="helloButton">
            سڵاو گیان
        </button>


        <button id="sadButton">
            خۆش حاڵ نەبووم
        </button>


        <!-- =================================================
             SCENE 3
        ================================================== -->

        <button id="confusedButton">
            قەلەقی چیت
        </button>


        <button id="skipButton">
            skip naz
        </button>


        <!-- =================================================
             SCENE 4
        ================================================== -->

        <button
            id="notForgiveButton"
            class="scene4-button">

            ئاشت ناکەمەوە

        </button>


        <button
            id="kissButton"
            class="scene4-button">

            وەرە بە ماچت کەم و ئاشت بینەوە

        </button>


    </div>

</div>



<script>

/* =====================================================
   ELEMENTS
===================================================== */

const body =
    document.body;


const image =
    document.getElementById(
        "characterImage"
    );


const text =
    document.getElementById(
        "storyText"
    );


const finalEnd =
    document.getElementById(
        "finalEnd"
    );


const helloButton =
    document.getElementById(
        "helloButton"
    );


const sadButton =
    document.getElementById(
        "sadButton"
    );


const confusedButton =
    document.getElementById(
        "confusedButton"
    );


const skipButton =
    document.getElementById(
        "skipButton"
    );


const notForgiveButton =
    document.getElementById(
        "notForgiveButton"
    );


const kissButton =
    document.getElementById(
        "kissButton"
    );


/* =====================================================
   TEXTS
===================================================== */

const firstMessage =
    "سڵاو من کاوی، زۆرم خۆشەوێی بەساقەو بم نونی گیان";


const secondMessage =
    "زۆر بێتاقەتم";


const thirdMessage =
    "بەخوا زۆر قەلەقم 💔";


const fourthMessage =
    "ئەوە بێزار بووی لێم دەی وەڵا ئەبێ ئاشتم کەیتەوە";


const fifthMessage =
    "ئەی بەشاکەو بم هەر زانیم دڵم ناشکێنی";


let typingTimer = null;

let confusedStep = 0;


/* =====================================================
   TYPE TEXT
===================================================== */

function typeText(
    message,
    speed = 75
){

    clearInterval(
        typingTimer
    );

    text.textContent = "";

    let i = 0;

    typingTimer =
        setInterval(
            function(){

                if(
                    i < message.length
                ){

                    text.textContent +=
                        message[i];

                    i++;

                }
                else{

                    clearInterval(
                        typingTimer
                    );

                }

            },
            speed
        );
}


/* =====================================================
   MOVE BUTTON FAR
===================================================== */

function moveButtonFar(button){

    const margin = 15;


    const maxX =
        window.innerWidth -
        button.offsetWidth -
        margin;


    const maxY =
        window.innerHeight -
        button.offsetHeight -
        margin;


    const x =
        margin +
        Math.random() *
        Math.max(
            1,
            maxX - margin
        );


    const y =
        margin +
        Math.random() *
        Math.max(
            1,
            maxY - margin
        );


    /*
       گرنگ:
       لە کاتی پەنجەلێدان
       دەبێتە fixed
    */

    button.style.position =
        "fixed";


    button.style.left =
        x + "px";


    button.style.top =
        y + "px";


    button.style.right =
        "auto";


    button.style.bottom =
        "auto";


    button.style.transform =
        "none";
}


/* =====================================================
   SCENE 1
   سڵاو گیان → SCENE 2
===================================================== */

helloButton.addEventListener(
    "pointerdown",
    function(event){

        if(
            !body.classList.contains("sad") &&
            !body.classList.contains("confused") &&
            !body.classList.contains("scene4") &&
            !body.classList.contains("scene5")
        ){

            event.preventDefault();

            event.stopPropagation();

            goToScene2();

        }

    }
);


/* =====================================================
   SCENE 1
   خۆش حاڵ نەبووم → ڕاکردن
===================================================== */

sadButton.addEventListener(
    "pointerdown",
    function(event){

        if(
            !body.classList.contains("sad")
        ){

            event.preventDefault();

            event.stopPropagation();

            moveButtonFar(
                sadButton
            );

        }

    }
);


/* =====================================================
   SCENE 2
===================================================== */

function goToScene2(){

    body.className =
        "sad";


    image.src =
        "7b4e45edfbedd4efbcc4bab78fbefaec.jpg";


    typeText(
        secondMessage
    );


    helloButton.textContent =
        "بێتاقەت مەبە 🤗";


    sadButton.textContent =
        "بۆ بێتاقەتی 🤔";


    /*
       هەموو شوێنی کۆنی پاک دەکەینەوە
    */

    helloButton.style.position =
        "relative";

    helloButton.style.left =
        "auto";

    helloButton.style.top =
        "auto";

    helloButton.style.right =
        "auto";

    helloButton.style.bottom =
        "auto";

    helloButton.style.transform =
        "none";


    sadButton.style.position =
        "relative";

    sadButton.style.left =
        "auto";

    sadButton.style.top =
        "auto";

    sadButton.style.right =
        "auto";

    sadButton.style.bottom =
        "auto";

    sadButton.style.transform =
        "none";


    /*
       هەردوو دوگمە دیارن
    */

    helloButton.style.display =
        "inline-flex";

    sadButton.style.display =
        "inline-flex";


    confusedButton.style.display =
        "none";

    skipButton.style.display =
        "none";

    notForgiveButton.style.display =
        "none";

    kissButton.style.display =
        "none";

    finalEnd.style.display =
        "none";
}


/* =====================================================
   SCENE 2
   بێتاقەت مەبە → ڕاکردن

   تەنیا pointerdown
===================================================== */

helloButton.addEventListener(
    "pointerdown",
    function(event){

        if(
            body.classList.contains("sad")
        ){

            event.preventDefault();

            event.stopPropagation();

            moveButtonFar(
                helloButton
            );

        }

    }
);


/* =====================================================
   SCENE 2
   بۆ بێتاقەتی → SCENE 3
===================================================== */

sadButton.addEventListener(
    "pointerdown",
    function(event){

        if(
            body.classList.contains("sad")
        ){

            event.preventDefault();

            event.stopPropagation();

            goToScene3();

        }

    }
);


/* =====================================================
   SCENE 3
===================================================== */

function goToScene3(){

    body.className =
        "confused";


    image.src =
        "610ab076d09e74dd9d2b8bdd5fcaf35e.jpg";


    typeText(
        thirdMessage
    );


    helloButton.style.display =
        "none";

    sadButton.style.display =
        "none";


    confusedButton.style.display =
        "block";


    confusedButton.textContent =
        "قەلەقی چیت";


    confusedStep = 0;


    /*
       سەرەتا جێگیر
    */

    confusedButton.style.position =
        "relative";

    confusedButton.style.left =
        "auto";

    confusedButton.style.top =
        "auto";

    confusedButton.style.right =
        "auto";

    confusedButton.style.bottom =
        "auto";

    confusedButton.style.transform =
        "none";


    skipButton.style.display =
        "none";
}


/* =====================================================
   SCENE 3
   BUTTON MOVE
===================================================== */

function moveConfusedButton(){

    confusedButton.style.position =
        "fixed";


    const rangeX =
        120;


    const rangeY =
        80;


    const centerX =
        window.innerWidth / 2;


    const centerY =
        window.innerHeight * .72;


    const x =
        centerX -
        rangeX / 2 +
        Math.random() *
        rangeX -
        confusedButton.offsetWidth / 2;


    const y =
        centerY -
        rangeY / 2 +
        Math.random() *
        rangeY -
        confusedButton.offsetHeight / 2;


    confusedButton.style.left =
        Math.max(
            10,
            x
        ) + "px";


    confusedButton.style.top =
        Math.max(
            10,
            y
        ) + "px";
}


/* =====================================================
   SCENE 3 ACTION
===================================================== */

function confusedButtonAction(){

    if(
        !body.classList.contains(
            "confused"
        )
    ){

        return;
    }


    confusedStep++;


    if(
        confusedStep === 1
    ){

        confusedButton.textContent =
            "نا نایڵێم ناز ئەکەم";


        moveConfusedButton();


        skipButton.style.display =
            "block";


        const rect =
            confusedButton
            .getBoundingClientRect();


        skipButton.style.left =
            (
                rect.left +
                rect.width / 2
            ) + "px";


        skipButton.style.top =
            (
                rect.bottom +
                12
            ) + "px";


        skipButton.style.transform =
            "translateX(-50%)";

    }

    else{

        confusedButton.textContent =
            "دەی نازم زیاتر هەڵگرە 🤓";


        moveConfusedButton();

    }
}


/* =====================================================
   SCENE 3 BUTTON
===================================================== */

confusedButton.addEventListener(
    "pointerdown",
    function(event){

        event.preventDefault();

        event.stopPropagation();

        confusedButtonAction();

    }
);


/* =====================================================
   SKIP → SCENE 4
===================================================== */

skipButton.addEventListener(
    "pointerdown",
    function(event){

        event.preventDefault();

        event.stopPropagation();

        goToScene4();

    }
);


/* =====================================================
   SCENE 4
===================================================== */

function goToScene4(){

    body.className =
        "scene4";


    image.src =
        "ece914e7ddcc0c54f9f9e56c7dccc1e2.jpg";


    typeText(
        fourthMessage
    );


    helloButton.style.display =
        "none";

    sadButton.style.display =
        "none";

    confusedButton.style.display =
        "none";

    skipButton.style.display =
        "none";


    notForgiveButton.style.display =
        "inline-block";


    kissButton.style.display =
        "inline-block";


    /*
       هەردووکیان سەرەتا جێگیر
    */

    notForgiveButton.style.position =
        "relative";

    notForgiveButton.style.left =
        "auto";

    notForgiveButton.style.top =
        "auto";

    notForgiveButton.style.right =
        "auto";

    notForgiveButton.style.bottom =
        "auto";

    notForgiveButton.style.transform =
        "none";


    kissButton.style.position =
        "relative";

    kissButton.style.left =
        "auto";

    kissButton.style.top =
        "auto";

    kissButton.style.right =
        "auto";

    kissButton.style.bottom =
