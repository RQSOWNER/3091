<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>3091</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 220, 235, 0.7),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 80% 30%,
                    rgba(255, 240, 200, 0.7),
                    transparent 28%
                ),

                linear-gradient(
                    135deg,
                    #fffafc,
                    #fff5f8,
                    #fffdf5
                );

            min-height: 100vh;

            font-family:
                Arial,
                "Noto Sans Arabic",
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            overflow: hidden;

            position: relative;
        }


        /* =========================
           BACKGROUND FLOWERS
        ========================= */

        .flower {
            position: fixed;

            pointer-events: none;

            z-index: 0;

            user-select: none;

            animation:
                floating 5s ease-in-out infinite;
        }


        .flower1 {
            top: 5%;
            left: 5%;
            font-size: 42px;
        }

        .flower2 {
            top: 15%;
            right: 7%;
            font-size: 35px;

            animation-delay: 1s;
        }

        .flower3 {
            bottom: 12%;
            left: 8%;
            font-size: 48px;

            animation-delay: 2s;
        }

        .flower4 {
            bottom: 8%;
            right: 6%;
            font-size: 38px;

            animation-delay: 1.5s;
        }

        .flower5 {
            top: 45%;
            left: 2%;
            font-size: 30px;

            animation-delay: 2.5s;
        }

        .flower6 {
            top: 55%;
            right: 3%;
            font-size: 32px;

            animation-delay: 3s;
        }


        /* Lily flowers */

        .lily {
            position: fixed;

            pointer-events: none;

            z-index: 0;

            opacity: 0.75;

            filter:
                drop-shadow(
                    0 4px 8px
                    rgba(180, 120, 140, 0.18)
                );

            animation:
                lilyFloat 6s ease-in-out infinite;
        }


        .lily1 {
            top: 3%;
            right: 20%;
            font-size: 45px;
        }

        .lily2 {
            bottom: 3%;
            left: 22%;
            font-size: 43px;

            animation-delay: 2s;
        }

        .lily3 {
            top: 65%;
            right: 15%;
            font-size: 35px;

            animation-delay: 1s;
        }


        /* Sparkles */

        .sparkle {

            position: fixed;

            pointer-events: none;

            z-index: 0;

            color: #e8c8a0;

            font-size: 20px;

            animation:
                sparkleMove 3s ease-in-out infinite;
        }


        .s1 {
            top: 10%;
            left: 35%;
        }

        .s2 {
            top: 30%;
            right: 20%;

            animation-delay: 1s;
        }

        .s3 {
            bottom: 20%;
            right: 30%;

            animation-delay: 1.7s;
        }

        .s4 {
            bottom: 35%;
            left: 20%;

            animation-delay: 0.5s;
        }


        @keyframes floating {

            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(0deg);
            }

            50% {
                transform:
                    translateY(-18px)
                    rotate(8deg);
            }
        }


        @keyframes lilyFloat {

            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(-3deg);
            }

            50% {
                transform:
                    translateY(-15px)
                    rotate(5deg);
            }
        }


        @keyframes sparkleMove {

            0%,
            100% {
                opacity: 0.25;
                transform: scale(0.7);
            }

            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }


        /* =========================
           STORY
        ========================= */

        .story {

            width: 100%;

            max-width: 520px;

            text-align: center;

            position: relative;

            z-index: 2;
        }


        .character {

            width: 100%;

            max-width: 470px;

            height: auto;

            display: block;

            margin:
                0 auto 25px auto;

            object-fit: contain;

            user-select: none;

            -webkit-user-drag: none;

            filter:
                drop-shadow(
                    0 10px 20px
                    rgba(0, 0, 0, 0.12)
                );

            animation:
                imageShow 0.8s ease;
        }


        .story-text {

            color: #3b3032;

            font-size: 22px;

            line-height: 2;

            min-height: 95px;

            max-width: 480px;

            margin:
                0 auto 25px auto;

            padding: 0 10px;

            font-weight: 500;
        }


        /* =========================
           BUTTONS
        ========================= */

        .buttons {

            position: relative;

            width: 100%;

            height: 230px;

            overflow: visible;
        }


        button {

            width: 85%;

            max-width: 340px;

            padding: 13px 20px;

            background:
                rgba(255, 255, 255, 0.95);

            color: #3b3032;

            border:
                1px solid #eadde1;

            border-radius: 14px;

            font-size: 17px;

            font-family: inherit;

            cursor: pointer;

            box-shadow:
                0 5px 20px
                rgba(120, 80, 90, 0.12);

            transition:
                left 0.08s linear,
                top 0.08s linear,
                transform 0.08s linear;

            backdrop-filter:
                blur(5px);
        }


        /* Button 1 */

        #helloButton {

            position: absolute;

            top: 0;

            left: 50%;

            transform:
                translateX(-50%);
        }


        /* Emoji at beginning */

        #helloButton::before {

            content: "🤎";

            margin-left: 9px;

            font-size: 21px;
        }


        /* Flower at left */

        #helloButton::after {

            content: "🌷";

            margin-right: 9px;

            font-size: 21px;
        }


        /* =========================
           MOVING BUTTON
        ========================= */

        #sadButton {

            position: absolute;

            top: 65px;

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 10;

            white-space: nowrap;
        }


        /* =========================
           IMAGE ANIMATION
        ========================= */

        @keyframes imageShow {

            from {

                opacity: 0;

                transform:
                    scale(0.94);
            }

            to {

                opacity: 1;

                transform:
                    scale(1);
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            body {

                padding: 15px;
            }


            .character {

                max-width: 96vw;
            }


            .story-text {

                font-size: 20px;
            }


            button {

                width: 90%;

                font-size: 16px;
            }


            .flower1 {
                font-size: 32px;
            }

            .flower2 {
                font-size: 28px;
            }

            .flower3 {
                font-size: 35px;
            }

            .flower4 {
                font-size: 30px;
            }

            .lily1 {
                font-size: 32px;
            }

            .lily2 {
                font-size: 30px;
            }

            .lily3 {
                font-size: 28px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         FLOWERS
    ========================= -->

    <div class="flower flower1">🌸</div>

    <div class="flower flower2">🌷</div>

    <div class="flower flower3">🌺</div>

    <div class="flower flower4">🌸</div>

    <div class="flower flower5">🌷</div>

    <div class="flower flower6">🌺</div>


    <!-- Lily -->

    <div class="lily lily1">🌷</div>

    <div class="lily lily2">🌷</div>

    <div class="lily lily3">🌷</div>


    <!-- Sparkles -->

    <div class="sparkle s1">✦</div>

    <div class="sparkle s2">✧</div>

    <div class="sparkle s3">✦</div>

    <div class="sparkle s4">✧</div>


    <!-- =========================
         MAIN STORY
    ========================= -->

    <div class="story">


        <img
            src="bc2f39106e1a0c2f00d3cc1204eaec7a.jpg"
            alt="کاوی"
            class="character"
        >


        <div
            class="story-text"
            id="storyText">
        </div>


        <div
            class="buttons"
            id="buttonArea">


            <!-- First Button -->

            <button
                id="helloButton">

                سڵاو گیان

            </button>


            <!-- Second Button -->

            <button
                id="sadButton">

                خۆش حاڵ نەبووم

            </button>


        </div>

    </div>


    <script>


        /* =========================
           TYPING TEXT
        ========================= */

        const message =
            "سڵاو من کاوی، زۆرم خۆشەوێی بەساقەو بم نونی گیان";


        const textElement =
            document.getElementById(
                "storyText"
            );


        let currentLetter = 0;


        function typeText() {

            if (
                currentLetter <
                message.length
            ) {

                textElement.textContent +=
                    message.charAt(
                        currentLetter
                    );

                currentLetter++;


                setTimeout(
                    typeText,
                    70
                );
            }
        }


        typeText();



        /* =========================
           FIRST BUTTON
        ========================= */

        const helloButton =
            document.getElementById(
                "helloButton"
            );


        helloButton.addEventListener(
            "click",
            function () {

                alert(
                    "سڵاو گیان ❤️"
                );

            }
        );



        /* =========================
           MOVING BUTTON
        ========================= */

        const sadButton =
            document.getElementById(
                "sadButton"
            );


        const buttonArea =
            document.getElementById(
                "buttonArea"
            );



        function moveSadButton() {


            const areaWidth =
                window.innerWidth;


            const areaHeight =
                window.innerHeight;


            const buttonWidth =
                sadButton.offsetWidth;


            const buttonHeight =
                sadButton.offsetHeight;



            /*
             * زۆر دوور دەیبات
             * بۆ ئەوەی کلیکی لەسەر نەکرێت
             */


            const maxX =
                Math.max(
                    10,
                    areaWidth -
                    buttonWidth -
                    10
                );


            const maxY =
                Math.max(
                    10,
                    areaHeight -
                    buttonHeight -
                    10
                );



            const randomX =
                Math.floor(
                    Math.random() *
                    maxX
                );


            const randomY =
                Math.floor(
                    Math.random() *
                    maxY
                );



            sadButton.style.position =
                "fixed";


            sadButton.style.left =
                randomX + "px";


            sadButton.style.top =
                randomY + "px";


            sadButton.style.transform =
                "none";
        }



        /* Touch */

        sadButton.addEventListener(
            "touchstart",
            function (event) {

                event.preventDefault();

                moveSadButton();

            },
            {
                passive: false
            }
        );



        /* Mouse */

        sadButton.addEventListener(
            "pointerenter",
            function () {

                moveSadButton();

            }
        );



        /* Click */

        sadButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                moveSadButton();

            }
        );



        /* Extra protection for mobile */

        sadButton.addEventListener(
            "pointerdown",
            function (event) {

                event.preventDefault();

                moveSadButton();

            }
        );


    </script>

</body>

</html>
