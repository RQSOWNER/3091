<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3091</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#fff,#ffeef4);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  transition:background .7s ease;
}

.story{
  position:relative;
  z-index:10;
  width:min(92vw,420px);
  text-align:center;
}

#characterImage{
  width:min(75vw,280px);
  max-height:45vh;
  object-fit:cover;
  border-radius:24px;
  box-shadow:0 15px 40px rgba(0,0,0,.18);
  transition:.5s;
}

.story-text{
  min-height:58px;
  margin:20px 0;
  font-size:20px;
  font-weight:700;
  color:#5a2438;
}

.buttons{
  position:relative;
  min-height:130px;
}

button{
  border:0;
  border-radius:999px;
  padding:13px 22px;
  margin:7px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,.16);
  position:relative;
  z-index:30;
  user-select:none;
  touch-action:none;
}

#helloButton{
  background:#f7d7df;
  color:#6b2039;
}

#sadButton{
  background:#eee;
  color:#333;
}

#confusedButton{
  display:none;
  background:#ffd166;
  color:#432;
}

#skipButton{
  display:none;
  position:fixed;
  font-size:12px;
  padding:6px 12px;
  min-width:90px;
  background:white;
  color:#444;
}

/* ---------------- FIRST SCENE ---------------- */

.flower,
.lily,
.sparkle{
  position:absolute;
  z-index:1;
  pointer-events:none;
}

.flower{
  font-size:32px;
  animation:float 4s ease-in-out infinite;
}

.lily{
  font-size:38px;
  animation:float 5s ease-in-out infinite;
}

.sparkle{
  font-size:22px;
  animation:twinkle 2s ease-in-out infinite;
}

.f1{
  top:5%;
  left:7%;
}

.f2{
  top:15%;
  right:8%;
}

.f3{
  bottom:10%;
  left:8%;
}

.f4{
  bottom:18%;
  right:6%;
}

.l1{
  top:9%;
  left:42%;
}

.l2{
  bottom:7%;
  right:42%;
}

.s1{
  top:22%;
  left:20%;
}

.s2{
  top:30%;
  right:20%;
}

.s3{
  bottom:25%;
  left:22%;
}

.s4{
  bottom:20%;
  right:25%;
}

@keyframes float{
  50%{
    transform:translateY(-14px) rotate(5deg);
  }
}

@keyframes twinkle{
  50%{
    opacity:.35;
    transform:scale(1.4);
  }
}

/* ---------------- SAD SCENE ---------------- */

.sad-emoji{
  position:absolute;
  z-index:2;
  font-size:32px;
  opacity:.8;
  display:none;
  pointer-events:none;
  animation:rain 2.8s linear infinite;
}

body.sad{
  background:linear-gradient(180deg,#172033,#26354d);
}

body.sad .flower,
body.sad .lily,
body.sad .sparkle{
  display:none;
}

body.sad .sad-emoji{
  display:block;
}

@keyframes rain{

  0%{
    transform:translateY(-20vh);
    opacity:0;
  }

  15%{
    opacity:.85;
  }

  100%{
    transform:translateY(120vh);
    opacity:0;
  }
}

/* ---------------- CONFUSED SCENE ---------------- */

.confused-emoji{
  position:absolute;
  z-index:2;
  font-size:34px;
  pointer-events:none;
  animation:confusedFloat 2.2s ease-in-out infinite;
}

.c1{
  top:8%;
  left:8%;
}

.c2{
  top:18%;
  right:10%;
}

.c3{
  top:42%;
  left:4%;
}

.c4{
  bottom:20%;
  right:7%;
}

.c5{
  bottom:8%;
  left:18%;
}

.c6{
  bottom:12%;
  right:35%;
}

body.confused{
  background:
    radial-gradient(circle at 20% 20%,#7b2cbf,transparent 35%),
    radial-gradient(circle at 80% 30%,#ff006e,transparent 35%),
    radial-gradient(circle at 50% 80%,#3a86ff,transparent 35%),
    #18051f;

  animation:confusedBackground 1.8s ease-in-out infinite;
}

body.confused .flower,
body.confused .lily,
body.confused .sparkle,
body.confused .sad-emoji{
  display:none;
}

body.confused .story-text{
  color:white;
  text-shadow:0 0 12px rgba(255,255,255,.5);
}

body.confused #confusedButton{
  display:block;
}

@keyframes confusedBackground{

  0%,100%{
    transform:translate(0,0) rotate(0deg);
  }

  25%{
    transform:translate(3px,-2px) rotate(.4deg);
  }

  50%{
    transform:translate(-3px,2px) rotate(-.4deg);
  }

  75%{
    transform:translate(2px,1px) rotate(.3deg);
  }
}

@keyframes confusedFloat{

  0%,100%{
    transform:translate(0,0) rotate(0deg);
  }

  50%{
    transform:translate(12px,-18px) rotate(12deg);
  }
}

/* Emojis only on first scene */

body:not(.sad):not(.confused):not(.scene4)
#helloButton::before{
  content:"🤎 ";
}

body:not(.sad):not(.confused):not(.scene4)
#helloButton::after{
  content:" 🌷";
}

/* ---------------- SCENE 4 ---------------- */

body.scene4{
  background:linear-gradient(135deg,#fff5f8,#ffdce7);
}

body.scene4 .flower,
body.scene4 .lily,
body.scene4 .sparkle{
  display:block;
}

body.scene4 .sad-emoji,
body.scene4 .confused-emoji{
  display:none;
}

/* Mobile */

@media(max-width:600px){

  .flower{
    font-size:27px;
  }

  .lily{
    font-size:32px;
  }

  .sparkle{
    font-size:18px;
  }

  .sad-emoji{
    font-size:27px;
  }

  .confused-emoji{
    font-size:29px;
  }

  .story-text{
    font-size:18px;
  }
}
</style>
</head>

<body>

<!-- Flowers -->

<div class="flower f1">🌸</div>
<div class="flower f2">🌷</div>
<div class="flower f3">🌺</div>
<div class="flower f4">🌹</div>

<div class="lily l1">🌷</div>
<div class="lily l2">🌷</div>

<div class="sparkle s1">✨</div>
<div class="sparkle s2">💫</div>
<div class="sparkle s3">✨</div>
<div class="sparkle s4">💖</div>


<!-- Sad emojis -->

<div class="sad-emoji" style="left:8%;top:-10%">😟</div>
<div class="sad-emoji" style="left:25%;top:-30%;animation-delay:.4s">🙁</div>
<div class="sad-emoji" style="left:45%;top:-20%;animation-delay:.8s">😿</div>
<div class="sad-emoji" style="left:65%;top:-35%;animation-delay:1.2s">☹️</div>
<div class="sad-emoji" style="left:82%;top:-15%;animation-delay:1.6s">😭</div>
<div class="sad-emoji" style="left:55%;top:-45%;animation-delay:2s">😢</div>


<!-- Confused emojis -->

<div class="confused-emoji c1">🧐</div>
<div class="confused-emoji c2">😣</div>
<div class="confused-emoji c3">😧</div>
<div class="confused-emoji c4">😵‍💫</div>
<div class="confused-emoji c5">😵</div>
<div class="confused-emoji c6">🥴</div>


<!-- Story -->

<div class="story">

  <img
    id="characterImage"
    src="bc2f39106e1a0c2f00d3cc1204eaec7a.jpg"
    alt="story image"
  >

  <div
    class="story-text"
    id="storyText">
  </div>

  <div class="buttons">

    <button id="helloButton">
      سڵاو گیان
    </button>

    <button id="sadButton">
      خۆش حاڵ نەبووم
    </button>

    <button id="confusedButton">
      قەلەقی چیت
    </button>

    <button id="skipButton">
      skip naz
    </button>

  </div>

</div>


<script>

const body = document.body;

const image = document.getElementById("characterImage");

const text = document.getElementById("storyText");

const helloButton = document.getElementById("helloButton");

const sadButton = document.getElementById("sadButton");

const confusedButton =
document.getElementById("confusedButton");

const skipButton =
document.getElementById("skipButton");


/* Messages */

const firstMessage =
"سڵاو من کاوی، زۆرم خۆشەوێی بەساقەو بم نونی گیان";

const secondMessage =
"زۆر بێتاقەتم";

const thirdMessage =
"بەخوا زۆر قەلەقم 💔";


let typingTimer = null;

let confusedStep = 0;


/* Type text letter by letter */

function typeText(message){

  clearInterval(typingTimer);

  text.textContent = "";

  let i = 0;

  typingTimer = setInterval(function(){

    if(i < message.length){

      text.textContent += message[i];

      i++;

    }else{

      clearInterval(typingTimer);

    }

  },75);
}


/* ---------------- MOVE BUTTON ---------------- */

/*
   ئەم فانکشنە دوگمەکە هەر جارێک
   هەوڵی دەست لێدان/کلیک دەکرێت
   شوێنی دەگۆڕێت.
*/

function moveAway(button){

  const margin = 15;

  const maxX =
    window.innerWidth -
    button.offsetWidth -
    margin;

  const maxY =
    window.innerHeight -
    button.offsetHeight -
    margin;

  const x =
    margin +
    Math.random() *
    Math.max(1,maxX - margin);

  const y =
    margin +
    Math.random() *
    Math.max(1,maxY - margin);

  button.style.position = "fixed";

  button.style.left = x + "px";

  button.style.top = y + "px";
}


/* ---------------- SCENE 2 BUTTON ---------------- */

function moveSadButton(){

  moveAway(sadButton);

}


/* ---------------- SCENE 2 BUTTON 1 ---------------- */

function moveHelloButton(){

  moveAway(helloButton);

}


/* ---------------- SCENE 3 BUTTON ---------------- */

function moveConfusedButton(){

  confusedButton.style.position = "fixed";

  const rangeX = 120;

  const rangeY = 80;

  const centerX =
    window.innerWidth / 2;

  const centerY =
    window.innerHeight * .72;

  const x =
    centerX -
    rangeX / 2 +
    Math.random() * rangeX -
    confusedButton.offsetWidth / 2;

  const y =
    centerY -
    rangeY / 2 +
    Math.random() * rangeY -
    confusedButton.offsetHeight / 2;

  confusedButton.style.left =
    Math.max(10,x) + "px";

  confusedButton.style.top =
    Math.max(10,y) + "px";
}


/* ---------------- SCENE 1 → SCENE 2 ---------------- */

function goToScene2(){

  body.classList.remove("confused");

  body.classList.remove("scene4");

  body.classList.add("sad");

  image.src =
    "7b4e45edfbedd4efbcc4bab78fbefaec.jpg";

  typeText(secondMessage);

  helloButton.textContent =
    "بێتاقەت مەبە 🤗";

  sadButton.textContent =
    "بۆ بێتاقەتی 🤔";


  /* Reset positions */

  helloButton.style.position = "relative";

  helloButton.style.left = "";

  helloButton.style.top = "";

  sadButton.style.position = "relative";

  sadButton.style.left = "";

  sadButton.style.top = "";


  confusedButton.style.display = "none";

  skipButton.style.display = "none";
}


/* ---------------- SCENE 2 → SCENE 3 ---------------- */

function goToScene3(){

  body.classList.remove("sad");

  body.classList.remove("scene4");

  body.classList.add("confused");

  image.src =
    "610ab076d09e74dd9d2b8bdd5fcaf35e.jpg";

  typeText(thirdMessage);

  helloButton.style.display = "none";

  sadButton.style.display = "none";

  confusedButton.style.display = "block";

  confusedButton.textContent =
    "قەلەقی چیت";

  confusedStep = 0;

  confusedButton.style.position =
    "relative";

  confusedButton.style.left = "";

  confusedButton.style.top = "";

  skipButton.style.display = "none";
}


/* ---------------- SCENE 3 BUTTON ---------------- */

function confusedButtonAction(){

  if(!body.classList.contains("confused")){
    return;
  }

  confusedStep++;


  if(confusedStep === 1){

    confusedButton.textContent =
      "نا نایڵێم ناز ئەکەم";

    /* Move first */

    moveConfusedButton();

    /* Show skip */

    skipButton.style.display =
      "block";


    /* Put skip below button */

    const rect =
      confusedButton.getBoundingClientRect();

    skipButton.style.position =
      "fixed";

    skipButton.style.left =
      (rect.left + rect.width / 2) + "px";

    skipButton.style.top =
      (rect.bottom + 12) + "px";

    skipButton.style.transform =
      "translateX(-50%)";


  }else{

    confusedButton.textContent =
      "دەی نازم زیاتر هەڵگرە 🤓";

    moveConfusedButton();

  }
}


/* ---------------- SCENE 3 → SCENE 4 ---------------- */

function goToScene4(){

  body.classList.remove("confused");

  body.classList.remove("sad");

  body.classList.add("scene4");


  /* Image 4 */

  image.src =
    "ece914e7ddcc0c54f9f9e56c7dccc1e2.jpg";


  /* Scene 4 text */

  text.textContent = "💖";


  /* Hide buttons */

  confusedButton.style.display =
    "none";

  skipButton.style.display =
    "none";

  helloButton.style.display =
    "none";

  sadButton.style.display =
    "none";
}


/* ---------------- START ---------------- */

typeText(firstMessage);


/*
   Scene 1:
   سڵاو گیان → Scene 2
*/

helloButton.addEventListener(
  "click",
  function(){

    if(body.classList.contains("sad")){
      return;
    }

    if(body.classList.contains("confused")){
      return;
    }

    goToScene2();

  }
);


/*
   Scene 2:
   بێتاقەت مەبە → هەڵدێت
*/

helloButton.addEventListener(
  "pointerdown",
  function(event){

    if(body.classList.contains("sad")){

      event.preventDefault();

      moveHelloButton();

    }

  }
);


/*
   Scene 1:
   خۆش حاڵ نەبووم → هەڵدێت
   هەر جارێک دەستت لێی دەدات
*/

sadButton.addEventListener(
  "pointerdown",
  function(event){

    if(!body.classList.contains("sad")){

      event.preventDefault();

      moveSadButton();

    }

  }
);


/*
   بۆ ئەوەی لە Scene 1
   بە کلیک هیچ شتێک ڕوونەدات
*/

sadButton.addEventListener(
  "click",
  function(event){

    if(!body.classList.contains("sad")){

      event.preventDefault();

      moveSadButton();

      return;

    }

    /* Scene 2 → Scene 3 */

    goToScene3();

  }
);


/*
   Scene 3 button
*/

confusedButton.addEventListener(
  "pointerdown",
  function(event){

    event.preventDefault();

    confusedButtonAction();

  }
);


/*
   Skip naz → Image 4
*/

skipButton.addEventListener(
  "pointerdown",
  function(event){

    event.preventDefault();

    goToScene4();

  }
);

</script>

</body>
</html>
